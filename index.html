<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Familien-Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        .container {
            width: 100%;
            height: 100%;
            padding: 2vh 2vw;
            display: flex;
            flex-direction: column;
        }

        /* Header Bereich */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2vh;
            height: 26vh;
        }

        /* Datum & Zeit (oben links) */
        .date-time {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 1.5vh 2vw;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            flex: 0 0 auto;
        }

        .time {
            font-size: 4vw;
            font-weight: 700;
            margin-bottom: 0.5vh;
            letter-spacing: 2px;
            line-height: 1;
        }

        .date {
            font-size: 1.8vw;
            opacity: 0.9;
        }

        .weekday {
            font-size: 1.5vw;
            opacity: 0.8;
            margin-top: 0.5vh;
        }

        /* Wetter (oben rechts) */
        .weather {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 1.5vh 2vw;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            flex: 0 0 50%;
            display: flex;
            flex-direction: column;
        }

        .weather-city {
            font-size: 1.6vw;
            margin-bottom: 1vh;
            font-weight: 600;
            text-align: center;
        }

        .weather-current {
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-bottom: 1.5vh;
        }

        .weather-icon {
            font-size: 4.5vw;
            line-height: 1;
        }

        .weather-temp {
            font-size: 3.5vw;
            font-weight: 700;
            line-height: 1;
        }

        .weather-description {
            font-size: 1.3vw;
            text-transform: capitalize;
            opacity: 0.9;
            text-align: center;
            margin-bottom: 1vh;
        }

        .weather-details {
            display: flex;
            justify-content: space-around;
            font-size: 1vw;
            margin-bottom: 1vh;
            padding: 0 1vw;
        }

        /* Wetter-Prognose */
        .weather-forecast {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1vw;
            margin-top: auto;
        }

        .forecast-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 1vh 1vw;
            border-radius: 10px;
            text-align: center;
        }

        .forecast-title {
            font-size: 0.9vw;
            font-weight: 600;
            margin-bottom: 0.5vh;
            opacity: 0.9;
        }

        .forecast-icon {
            font-size: 2vw;
            margin: 0.3vh 0;
        }

        .forecast-temp {
            font-size: 1.2vw;
            font-weight: 700;
            margin: 0.3vh 0;
        }

        .forecast-rain {
            font-size: 0.8vw;
            opacity: 0.8;
        }

        /* Mittlerer Bereich - Platzhalter für weitere Widgets */
        .middle-section {
            flex: 1;
            display: flex;
            gap: 1vw;
            margin-bottom: 2vh;
            min-height: 0;
        }

        .widget {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5vh 1.5vw;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* Kalender (unteres Drittel) */
        .calendar-section {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5vh 2vw;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            height: 32vh;
            flex-shrink: 0;
        }

        .calendar-header {
            font-size: 1.6vw;
            font-weight: 600;
            margin-bottom: 1vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.8vw;
            height: calc(100% - 4vh);
        }

        .calendar-day {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1vh 0.5vw;
            display: flex;
            flex-direction: column;
        }

        .calendar-day.today {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .day-name {
            font-size: 0.9vw;
            font-weight: 600;
            margin-bottom: 0.5vh;
            opacity: 0.9;
        }

        .day-number {
            font-size: 1.5vw;
            font-weight: 700;
            margin-bottom: 0.5vh;
        }

        .day-events {
            flex: 1;
            overflow-y: auto;
            font-size: 0.7vw;
        }

        .event {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.3vh 0.5vw;
            border-radius: 6px;
            margin-bottom: 0.3vh;
            font-size: 0.65vw;
        }

        .event-time {
            font-weight: 600;
            margin-bottom: 0.2vh;
        }

        .ics-upload {
            margin-top: 0.5vh;
        }

        .file-input-wrapper {
            display: inline-block;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5vh 1vw;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 0.8vw;
        }

        .file-input-wrapper:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        input[type="file"] {
            display: none;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .loading {
            opacity: 0.6;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header mit Datum und Wetter -->
        <div class="header">
            <!-- Datum & Zeit (links) -->
            <div class="date-time">
                <div class="time" id="time">--:--</div>
                <div class="date" id="date">Laden...</div>
                <div class="weekday" id="weekday"></div>
            </div>

            <!-- Wetter (rechts) -->
            <div class="weather">
                <div class="weather-city">Berlin</div>
                <div class="weather-current">
                    <div class="weather-icon" id="weatherIcon">☀️</div>
                    <div class="weather-temp" id="weatherTemp">--°C</div>
                </div>
                <div class="weather-description" id="weatherDesc">Laden...</div>
                <div class="weather-details">
                    <div>💧 <span id="humidity">--%</span></div>
                    <div>💨 <span id="windSpeed">-- km/h</span></div>
                </div>
                <div class="weather-forecast">
                    <div class="forecast-item">
                        <div class="forecast-title">Vormittag</div>
                        <div class="forecast-icon" id="forecastMorningIcon">☀️</div>
                        <div class="forecast-temp" id="forecastMorningTemp">--°C</div>
                        <div class="forecast-rain" id="forecastMorningRain">💧 --%</div>
                    </div>
                    <div class="forecast-item">
                        <div class="forecast-title">Nachmittag</div>
                        <div class="forecast-icon" id="forecastAfternoonIcon">☀️</div>
                        <div class="forecast-temp" id="forecastAfternoonTemp">--°C</div>
                        <div class="forecast-rain" id="forecastAfternoonRain">💧 --%</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mittlerer Bereich (kann für weitere Widgets genutzt werden) -->
        <div class="middle-section">
            <!-- Platzhalter für zukünftige Widgets -->
        </div>

        <!-- Kalender Wochenansicht -->
        <div class="calendar-section">
            <div class="calendar-header">
                <span>📅 Diese Woche</span>
                <div class="ics-upload">
                    <label class="file-input-wrapper">
                        <input type="file" id="icsFile" accept=".ics" onchange="loadICSFile(event)">
                        📎 ICS-Datei laden
                    </label>
                </div>
            </div>
            <div class="calendar-week" id="calendarWeek">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>
    </div>

    <script>
        // Datum und Uhrzeit aktualisieren
        function updateDateTime() {
            const now = new Date();

            // Zeit
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}`;

            // Datum
            const days = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
            const months = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
                           'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

            const weekday = days[now.getDay()];
            const day = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear();

            document.getElementById('weekday').textContent = weekday;
            document.getElementById('date').textContent = `${day}. ${month} ${year}`;
        }

        // Wetter abrufen
        async function updateWeather() {
            try {
                // Verwende Open-Meteo API (keine API-Key erforderlich)
                // Berlin Koordinaten: 52.52, 13.405
                // Erweitert um stündliche Prognose
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.405&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&timezone=Europe/Berlin&forecast_days=1');
                const data = await response.json();

                // Aktuelles Wetter
                if (data.current) {
                    const temp = Math.round(data.current.temperature_2m);
                    const humidity = data.current.relative_humidity_2m;
                    const windSpeed = Math.round(data.current.wind_speed_10m);
                    const weatherCode = data.current.weather_code;

                    document.getElementById('weatherTemp').textContent = `${temp}°C`;
                    document.getElementById('humidity').textContent = `${humidity}%`;
                    document.getElementById('windSpeed').textContent = `${windSpeed} km/h`;

                    // Wetter-Icons und Beschreibungen basierend auf WMO Code
                    const weatherInfo = getWeatherInfo(weatherCode);
                    document.getElementById('weatherIcon').textContent = weatherInfo.icon;
                    document.getElementById('weatherDesc').textContent = weatherInfo.description;
                }

                // Prognose für Vormittag (10 Uhr) und Nachmittag (15 Uhr)
                if (data.hourly) {
                    const now = new Date();
                    const hourlyTimes = data.hourly.time;

                    // Finde Index für 10:00 (Vormittag) und 15:00 (Nachmittag) heute
                    const morningIndex = hourlyTimes.findIndex(time => {
                        const date = new Date(time);
                        return date.getDate() === now.getDate() && date.getHours() === 10;
                    });

                    const afternoonIndex = hourlyTimes.findIndex(time => {
                        const date = new Date(time);
                        return date.getDate() === now.getDate() && date.getHours() === 15;
                    });

                    // Vormittag-Prognose
                    if (morningIndex !== -1) {
                        const morningTemp = Math.round(data.hourly.temperature_2m[morningIndex]);
                        const morningRain = data.hourly.precipitation_probability[morningIndex] || 0;
                        const morningCode = data.hourly.weather_code[morningIndex];
                        const morningInfo = getWeatherInfo(morningCode);

                        document.getElementById('forecastMorningTemp').textContent = `${morningTemp}°C`;
                        document.getElementById('forecastMorningRain').textContent = `💧 ${morningRain}%`;
                        document.getElementById('forecastMorningIcon').textContent = morningInfo.icon;
                    }

                    // Nachmittag-Prognose
                    if (afternoonIndex !== -1) {
                        const afternoonTemp = Math.round(data.hourly.temperature_2m[afternoonIndex]);
                        const afternoonRain = data.hourly.precipitation_probability[afternoonIndex] || 0;
                        const afternoonCode = data.hourly.weather_code[afternoonIndex];
                        const afternoonInfo = getWeatherInfo(afternoonCode);

                        document.getElementById('forecastAfternoonTemp').textContent = `${afternoonTemp}°C`;
                        document.getElementById('forecastAfternoonRain').textContent = `💧 ${afternoonRain}%`;
                        document.getElementById('forecastAfternoonIcon').textContent = afternoonInfo.icon;
                    }
                }
            } catch (error) {
                console.error('Fehler beim Abrufen der Wetterdaten:', error);
                document.getElementById('weatherDesc').textContent = 'Fehler beim Laden';
            }
        }

        // Wetter-Info basierend auf WMO Weather Code
        function getWeatherInfo(code) {
            const weatherCodes = {
                0: { icon: '☀️', description: 'Klar' },
                1: { icon: '🌤️', description: 'Überwiegend klar' },
                2: { icon: '⛅', description: 'Teilweise bewölkt' },
                3: { icon: '☁️', description: 'Bewölkt' },
                45: { icon: '🌫️', description: 'Nebelig' },
                48: { icon: '🌫️', description: 'Nebel mit Reifbildung' },
                51: { icon: '🌦️', description: 'Leichter Nieselregen' },
                53: { icon: '🌦️', description: 'Nieselregen' },
                55: { icon: '🌧️', description: 'Starker Nieselregen' },
                61: { icon: '🌧️', description: 'Leichter Regen' },
                63: { icon: '🌧️', description: 'Regen' },
                65: { icon: '⛈️', description: 'Starker Regen' },
                71: { icon: '🌨️', description: 'Leichter Schneefall' },
                73: { icon: '🌨️', description: 'Schneefall' },
                75: { icon: '❄️', description: 'Starker Schneefall' },
                77: { icon: '🌨️', description: 'Schneekörner' },
                80: { icon: '🌦️', description: 'Leichte Regenschauer' },
                81: { icon: '🌧️', description: 'Regenschauer' },
                82: { icon: '⛈️', description: 'Starke Regenschauer' },
                85: { icon: '🌨️', description: 'Leichte Schneeschauer' },
                86: { icon: '❄️', description: 'Schneeschauer' },
                95: { icon: '⛈️', description: 'Gewitter' },
                96: { icon: '⛈️', description: 'Gewitter mit Hagel' },
                99: { icon: '⛈️', description: 'Gewitter mit Hagel' }
            };

            return weatherCodes[code] || { icon: '🌡️', description: 'Unbekannt' };
        }

        // Kalender-Wochenansicht erstellen
        let calendarEvents = [];

        function updateCalendar() {
            const now = new Date();
            const calendarWeek = document.getElementById('calendarWeek');
            calendarWeek.innerHTML = '';

            // Montag der aktuellen Woche finden
            const dayOfWeek = now.getDay();
            const monday = new Date(now);
            monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
            monday.setHours(0, 0, 0, 0);

            const dayNames = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

            // 7 Tage (Mo-So) anzeigen
            for (let i = 0; i < 7; i++) {
                const currentDay = new Date(monday);
                currentDay.setDate(monday.getDate() + i);

                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';

                // Heute markieren
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                if (currentDay.getTime() === today.getTime()) {
                    dayDiv.classList.add('today');
                }

                dayDiv.innerHTML = `
                    <div class="day-name">${dayNames[i]}</div>
                    <div class="day-number">${currentDay.getDate()}</div>
                    <div class="day-events" id="events-${i}"></div>
                `;

                calendarWeek.appendChild(dayDiv);

                // Events für diesen Tag anzeigen
                displayEventsForDay(currentDay, i);
            }
        }

        function displayEventsForDay(day, dayIndex) {
            const eventsContainer = document.getElementById(`events-${dayIndex}`);
            eventsContainer.innerHTML = '';

            // Events für diesen Tag filtern
            const dayStart = new Date(day);
            dayStart.setHours(0, 0, 0, 0);
            const dayEnd = new Date(day);
            dayEnd.setHours(23, 59, 59, 999);

            const dayEvents = calendarEvents.filter(event => {
                return event.start >= dayStart && event.start <= dayEnd;
            });

            // Events nach Zeit sortieren
            dayEvents.sort((a, b) => a.start - b.start);

            // Events anzeigen
            dayEvents.forEach(event => {
                const eventDiv = document.createElement('div');
                eventDiv.className = 'event';
                const timeStr = event.start.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                eventDiv.innerHTML = `
                    <div class="event-time">${timeStr}</div>
                    <div>${event.title}</div>
                `;
                eventsContainer.appendChild(eventDiv);
            });
        }

        // ICS-Datei laden und parsen
        function loadICSFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const icsContent = e.target.result;
                parseICS(icsContent);
                updateCalendar();
            };
            reader.readAsText(file);
        }

        // ICS-Parser (vereinfacht)
        function parseICS(icsContent) {
            calendarEvents = [];
            const lines = icsContent.split('\n');
            let currentEvent = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line === 'BEGIN:VEVENT') {
                    currentEvent = {};
                } else if (line === 'END:VEVENT' && currentEvent) {
                    if (currentEvent.start && currentEvent.title) {
                        calendarEvents.push(currentEvent);
                    }
                    currentEvent = null;
                } else if (currentEvent) {
                    if (line.startsWith('DTSTART')) {
                        const dateStr = line.split(':')[1];
                        currentEvent.start = parseICSDate(dateStr);
                    } else if (line.startsWith('DTEND')) {
                        const dateStr = line.split(':')[1];
                        currentEvent.end = parseICSDate(dateStr);
                    } else if (line.startsWith('SUMMARY:')) {
                        currentEvent.title = line.substring(8);
                    }
                }
            }
        }

        // ICS-Datum parsen
        function parseICSDate(dateStr) {
            // Format: YYYYMMDDTHHMMSS oder YYYYMMDD
            dateStr = dateStr.replace(/[Z\r]/g, '');

            const year = parseInt(dateStr.substring(0, 4));
            const month = parseInt(dateStr.substring(4, 6)) - 1;
            const day = parseInt(dateStr.substring(6, 8));

            if (dateStr.includes('T')) {
                const hour = parseInt(dateStr.substring(9, 11));
                const minute = parseInt(dateStr.substring(11, 13));
                return new Date(year, month, day, hour, minute);
            } else {
                return new Date(year, month, day);
            }
        }

        // Initialisierung
        updateDateTime();
        updateWeather();
        updateCalendar();

        // Regelmäßige Updates
        setInterval(updateDateTime, 1000); // Jede Sekunde
        setInterval(updateWeather, 600000); // Alle 10 Minuten
        setInterval(updateCalendar, 60000); // Jede Minute
    </script>
</body>
</html>
